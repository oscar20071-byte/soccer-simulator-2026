<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111d">
<title>Soccer Simulator 2026</title><link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#07111d;--panel:#0e1b2b;--panel2:#122338;--line:#20354b;--text:#eef6ff;--muted:#91a6bd;--green:#13d6a0;--red:#ff6681;--gold:#f4c96b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px Inter,system-ui,Segoe UI,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--green);color:#03150f;font-weight:800}button:disabled{opacity:.35;cursor:not-allowed}button.secondary{background:#17283b;color:var(--text);border:1px solid var(--line)}button.danger{background:#48202b;color:#ffdce3}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:#091522;border-right:1px solid var(--line);padding:20px 14px}.brand{font-weight:950;letter-spacing:.08em;font-size:19px;margin:4px 8px 28px}.brand small{display:block;color:var(--green);font-size:10px;letter-spacing:.2em;margin-top:4px}.nav{display:grid;gap:7px}.nav button{background:transparent;color:var(--muted);text-align:left;font-weight:650}.nav button.active,.nav button:hover{background:#10352f;color:var(--green)}.main{min-width:0}.top{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px}.top span{color:var(--muted);font-size:12px;letter-spacing:.12em;font-weight:800}.content{padding:28px;max-width:1500px;margin:auto}.hero{border:1px solid var(--line);border-radius:22px;padding:32px;background:radial-gradient(ellipse at 85% 10%,#0e594d 0,transparent 40%),linear-gradient(120deg,#0d1b2b,#0a1926);min-height:220px}.eyebrow{color:var(--green);font-size:11px;font-weight:900;letter-spacing:.18em}.hero h1{font-size:clamp(30px,5vw,54px);line-height:1;margin:14px 0}.hero p{color:#b6c7d8;max-width:650px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:18px 0}.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}.stat small{color:var(--muted);font-weight:800;letter-spacing:.1em;font-size:10px}.stat strong{display:block;font-size:30px;margin-top:6px}.card{margin-top:16px;overflow:hidden}.card h2{margin:0 0 14px;font-size:18px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.field{display:grid;gap:6px;min-width:135px;flex:1}.field label{color:var(--muted);font-size:12px;font-weight:700}.field input,.field select{background:#081522;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:11px;min-width:0;width:100%}table{width:100%;border-collapse:collapse;min-width:540px}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.1em}.tablewrap{overflow-x:auto}.empty{color:var(--muted);padding:18px 0}.team{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.team:last-child{border:0}.pill{font-size:11px;color:var(--green);background:#10352f;padding:5px 8px;border-radius:99px;white-space:nowrap}.notice{color:var(--muted);font-size:12px;line-height:1.5}.mobilebar{display:none}.fixture{display:grid;grid-template-columns:1fr auto 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.fixture:last-child{border:0}.fixture .away{text-align:right}.score{font-size:20px;font-weight:950;color:var(--green);white-space:nowrap}.subhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.tag{color:var(--gold);font-size:11px}.eventline{padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}.muted{color:var(--muted)}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.smallbtn{padding:7px 10px;font-size:12px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#173b34;border:1px solid #247d67;color:#eafff7;padding:12px 18px;border-radius:12px;z-index:10;box-shadow:0 10px 30px #0008}
@media(max-width:850px){.app{grid-template-columns:1fr}.side{display:none}.mobilebar{display:flex;overflow:auto;gap:6px;padding:8px;background:#091522;border-bottom:1px solid var(--line)}.mobilebar button{white-space:nowrap;padding:9px 11px}.top{padding:0 16px}.content{padding:16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding:23px}.two{grid-template-columns:1fr}}
@media(max-width:480px){.grid{grid-template-columns:1fr 1fr}.stat{padding:13px}.stat strong{font-size:24px}.top{height:60px}.fixture{grid-template-columns:1fr auto 1fr}.fixture button{grid-column:1/-1}.fixture .home,.fixture .away{font-size:13px}}
</style></head>
<body><div class="app"><aside class="side"><div class="brand">SOCCER<span style="color:var(--green)">SIM</span><small>SIMULATOR 2026</small></div><nav class="nav" id="sideNav"></nav><p class="notice" style="margin:28px 8px">Edición personal · Los datos se guardan en este dispositivo.</p></aside><div class="main"><header class="top"><span id="sectionLabel">CENTRO DE OPERACIONES</span><div class="row" style="align-items:center"><span class="pill">MODO LOCAL</span><button id="installBtn" class="secondary" hidden>Instalar app</button></div></header><nav class="mobilebar" id="mobileNav"></nav><main class="content" id="view"></main></div></div>
<script>
const pages=[['home','Inicio'],['teams','Equipos'],['players','Jugadores'],['competitions','Ligas'],['matches','Partidos'],['history','Historial'],['settings','Configuración']];
const read=(k,d)=>{try{return JSON.parse(localStorage.getItem('ss26_'+k))??d}catch{return d}};
let teams=read('teams',[]),players=read('players',[]),comps=read('comps',[]),matches=read('matches',[]),page='home';
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
teams.forEach(t=>t.id=t.id||uid());players.forEach(p=>{p.id=p.id||uid();p.stats=p.stats||{apps:0,goals:0,assists:0}});comps.forEach(c=>{c.id=c.id||uid();c.teams=c.teams||[];c.fixtures=c.fixtures||[]});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>{for(const [k,v] of Object.entries({teams,players,comps,matches}))localStorage.setItem('ss26_'+k,JSON.stringify(v));render()};
function toast(msg){const old=document.querySelector('.toast');if(old)old.remove();const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),2600)}
function nav(){for(const id of ['sideNav','mobileNav'])document.getElementById(id).innerHTML=pages.map(([k,n])=>`<button class="${page===k?'active':''}" data-page="${k}">${n}</button>`).join('')}
function shell(title,body){document.getElementById('sectionLabel').textContent=title.toUpperCase();document.getElementById('view').innerHTML=body;nav()}
function strength(teamName){const squad=players.filter(p=>p.team===teamName).sort((a,b)=>b.rating-a.rating).slice(0,11);if(!squad.length)return teams.find(t=>t.name===teamName)?.rating||65;return squad.reduce((s,p)=>s+(+p.rating||60),0)/squad.length}
function standings(comp){const rows=(comp.teams||[]).map(name=>({name,pj:0,g:0,e:0,p:0,gf:0,gc:0,pts:0}));const map=Object.fromEntries(rows.map(r=>[r.name,r]));matches.filter(m=>m.competition===comp.name).forEach(m=>{const h=map[m.home],a=map[m.away];if(!h||!a)return;h.pj++;a.pj++;h.gf+=m.a;h.gc+=m.b;a.gf+=m.b;a.gc+=m.a;if(m.a>m.b){h.g++;h.pts+=3;a.p++}else if(m.a<m.b){a.g++;a.pts+=3;h.p++}else{h.e++;a.e++;h.pts++;a.pts++}});return rows.sort((a,b)=>b.pts-a.pts||(b.gf-b.gc)-(a.gf-a.gc)||b.gf-a.gf||a.name.localeCompare(b.name))}
function home(){shell('Centro de operaciones',`<section class="hero"><div class="eyebrow">TU UNIVERSO FUTBOLÍSTICO</div><h1>Tu fútbol.<br>Tus reglas.</h1><p>Crea clubes, inventa futbolistas, organiza ligas y genera temporadas completas. El calendario y la clasificación se actualizan con cada partido simulado.</p><div class="actions"><button data-go="teams">+ Crear equipo</button><button class="secondary" data-go="players">Crear jugador</button><button class="secondary" data-go="competitions">Crear liga</button></div></section><div class="grid"><div class="stat"><small>EQUIPOS</small><strong>${teams.length}</strong></div><div class="stat"><small>JUGADORES</small><strong>${players.length}</strong></div><div class="stat"><small>LIGAS</small><strong>${comps.length}</strong></div><div class="stat"><small>PARTIDOS JUGADOS</small><strong>${matches.length}</strong></div></div><div class="card"><h2>Últimos resultados</h2>${matches.length?matches.slice(-5).reverse().map(m=>`<div class="fixture"><span class="home">${esc(m.home)}</span><b class="score">${m.a} - ${m.b}</b><span class="away">${esc(m.away)}</span><span class="tag">${esc(m.competition||'Amistoso')}</span></div>`).join(''):'<p class="empty">Tu historial aparecerá aquí después de jugar el primer partido.</p>'}</div>`)}
function teamsPage(){shell('Gestión de equipos',`<div class="eyebrow">CLUBES PERSONALIZADOS</div><h1>Equipos</h1><div class="card"><h2>Crear club</h2><form id="teamForm" class="row"><div class="field"><label>Nombre del equipo</label><input name="name" required maxlength="36" placeholder="Ej. Atlético Central"></div><div class="field" style="max-width:170px"><label>Valoración base</label><input name="rating" type="number" min="1" max="100" value="70" required></div><button>Crear equipo</button></form></div><div class="card"><h2>Mis clubes (${teams.length})</h2>${teams.length?teams.map((t,i)=>{const squad=players.filter(p=>p.team===t.name);return `<div class="team"><div><b>⚽ ${esc(t.name)}</b><div class="notice">Valoración base ${t.rating} · ${squad.length} jugadores</div></div><button class="danger smallbtn" data-delete-team="${i}" ${comps.some(c=>c.teams.includes(t.name))?'disabled title="Inscrito en una liga"':''}>Eliminar</button></div>`}).join(''):'<p class="empty">Todavía no has creado equipos.</p>'}</div>`)}
function playersPage(){shell('Plantillas y futbolistas',`<div class="eyebrow">FUTBOLISTAS CREADOS POR TI</div><h1>Jugadores</h1><div class="card"><h2>Registrar jugador</h2>${teams.length?`<form id="playerForm"><div class="row"><div class="field"><label>Nombre completo</label><input name="name" required maxlength="48" placeholder="Ej. Daniel Martínez"></div><div class="field"><label>Nacionalidad</label><input name="country" maxlength="32" placeholder="Dominicana"></div><div class="field"><label>Club</label><select name="team">${teams.map(t=>`<option>${esc(t.name)}</option>`).join('')}</select></div></div><div class="row" style="margin-top:12px"><div class="field"><label>Edad</label><input name="age" type="number" min="15" max="50" value="20" required></div><div class="field"><label>Posición</label><select name="position">${['POR','DFC','LI','LD','MCD','MC','MCO','EI','ED','DC'].map(p=>`<option>${p}</option>`).join('')}</select></div><div class="field"><label>Dorsal</label><input name="number" type="number" min="1" max="99" value="10" required></div><div class="field"><label>Valoración (1–100)</label><input name="rating" type="number" min="1" max="100" value="75" required></div></div><div class="actions"><button>Guardar jugador</button></div></form>`:'<p class="empty">Primero crea un equipo para asignarle futbolistas.</p>'}</div><div class="card"><div class="subhead"><h2>Plantillas</h2><span class="pill">${players.length} jugadores</span></div>${teams.length?teams.map(t=>{const squad=players.filter(p=>p.team===t.name).sort((a,b)=>a.number-b.number);return `<div style="margin-top:16px"><h3>${esc(t.name)} <span class="notice">(${squad.length})</span></h3>${squad.length?`<div class="tablewrap"><table><thead><tr><th>Dorsal</th><th>Jugador</th><th>Pos.</th><th>Edad</th><th>Media</th><th>PJ</th><th>G</th><th>A</th><th></th></tr></thead><tbody>${squad.map(p=>`<tr><td>${p.number}</td><td><b>${esc(p.name)}</b><div class="notice">${esc(p.country||'Sin nacionalidad')}</div></td><td>${esc(p.position)}</td><td>${p.age}</td><td>${p.rating}</td><td>${p.stats?.apps||0}</td><td>${p.stats?.goals||0}</td><td>${p.stats?.assists||0}</td><td><button class="danger smallbtn" data-delete-player="${p.id}">Quitar</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="notice">Plantilla vacía.</p>'}</div>`}).join(''):'<p class="empty">Crea un equipo para comenzar una plantilla.</p>'}</div>`)}
function makeSchedule(comp,double){const names=[...(comp.teams||[])];if(names.length<2)return [];const arr=[...names];if(arr.length%2)arr.push(null);const n=arr.length,rounds=n-1,half=n/2,fixtures=[];let rotation=[...arr];for(let r=0;r<rounds;r++){for(let i=0;i<half;i++){const a=rotation[i],b=rotation[n-1-i];if(a&&b){const home=(r+i)%2===0?a:b,away=home===a?b:a;fixtures.push({id:uid(),round:r+1,home,away,status:'Pendiente'})}}rotation=[rotation[0],rotation[n-1],...rotation.slice(1,n-1)]}if(double)fixtures.push(...fixtures.map(f=>({id:uid(),round:f.round+rounds,home:f.away,away:f.home,status:'Pendiente'})));return fixtures}
function compsPage(){shell('Ligas y competiciones',`<div class="eyebrow">CREA TU PROPIO CAMPEONATO</div><h1>Mis ligas</h1><div class="card"><h2>Nueva competición</h2><form id="compForm"><div class="row"><div class="field"><label>Nombre de la liga</label><input name="name" required maxlength="42" placeholder="Liga Nacional 2026"></div><div class="field"><label>Formato</label><select name="format"><option>Liga todos contra todos</option></select></div><div class="field"><label>Calendario</label><select name="legs"><option value="1">Una vuelta</option><option value="2">Ida y vuelta</option></select></div></div><div class="actions"><button>Crear liga</button></div></form></div>${comps.length?comps.map((c,ci)=>{const rows=standings(c),pending=(c.fixtures||[]).filter(f=>f.status!=='Jugado');return `<section class="card"><div class="subhead"><div><h2>${esc(c.name)}</h2><div class="notice">${esc(c.format||'Liga')} · ${c.teams.length} equipos · ${c.fixtures.length} partidos programados</div></div><button class="danger smallbtn" data-delete-comp="${ci}">Eliminar liga</button></div><form class="enrollForm" data-comp="${ci}" style="margin-top:12px"><div class="row"><div class="field"><label>Inscribir club</label><select name="team">${teams.filter(t=>!c.teams.includes(t.name)).map(t=>`<option>${esc(t.name)}</option>`).join('')}</select></div><button ${teams.every(t=>c.teams.includes(t.name))||c.fixtures.length?'disabled':''}>Inscribir equipo</button></div></form><div class="actions"><button class="secondary" data-calendar="${ci}" ${c.teams.length<2||c.fixtures.length?'disabled':''}>Generar calendario</button><span class="notice">${c.fixtures.length?'Calendario creado. Para cambiar equipos, elimina y vuelve a crear la liga.':''}</span></div><h3>Tabla de posiciones</h3>${rows.length?`<div class="tablewrap"><table><thead><tr><th>#</th><th>Equipo</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>GF</th><th>GC</th><th>DG</th><th>PTS</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td><td><b>${esc(r.name)}</b></td><td>${r.pj}</td><td>${r.g}</td><td>${r.e}</td><td>${r.p}</td><td>${r.gf}</td><td>${r.gc}</td><td>${r.gf-r.gc}</td><td><b>${r.pts}</b></td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">Inscribe al menos dos equipos para preparar la clasificación.</p>'}<h3 style="margin-top:22px">Calendario y resultados</h3>${c.fixtures.length?c.fixtures.map(f=>`<div class="fixture"><span class="home">J${f.round} · ${esc(f.home)}</span><b class="score">${f.status==='Jugado'?`${f.scoreHome} - ${f.scoreAway}`:'VS'}</b><span class="away">${esc(f.away)}</span>${f.status==='Jugado'?'<span class="pill">Jugado</span>':`<button class="smallbtn" data-play-fixture="${ci}|${f.id}">Simular</button>`}</div>`).join(''):'<p class="empty">Genera el calendario para crear los enfrentamientos automáticamente.</p>'}${pending.length===0&&c.fixtures.length?'<p class="pill" style="display:inline-block;margin-top:12px">Temporada completada</p>':''}</section>`}).join(''):'<div class="card"><p class="empty">Todavía no tienes ligas. Crea una y después inscribe tus equipos.</p></div>'}`)}
function poisson(lambda){const L=Math.exp(-lambda);let k=0,p=1;do{k++;p*=Math.random()}while(p>L&&k<8);return Math.min(7,k-1)}
function pickPlayer(teamName,exclude=[],eligibleIds=null){const squad=players.filter(p=>p.team===teamName&&!exclude.includes(p.id)&&(!eligibleIds||eligibleIds.includes(p.id)));if(!squad.length)return null;const weighted=squad.map(p=>({p,w:Math.max(1,(+p.rating||50)*(p.position==='DC'?1.5:['EI','ED','MCO'].includes(p.position)?1.25:0.8))}));let x=Math.random()*weighted.reduce((s,v)=>s+v.w,0);for(const v of weighted){x-=v.w;if(x<=0)return v.p}return weighted[0].p}
function playMatch(homeName,awayName,competition='',fixture=null){const hs=strength(homeName),as=strength(awayName);const hg=poisson(Math.max(.25,Math.min(3.2,1.25+(hs-as)/48+.18))),ag=poisson(Math.max(.25,Math.min(3.2,1.15+(as-hs)/48)));const homeLineup=players.filter(p=>p.team===homeName).sort((a,b)=>b.rating-a.rating).slice(0,11),awayLineup=players.filter(p=>p.team===awayName).sort((a,b)=>b.rating-a.rating).slice(0,11);const participants=[...homeLineup,...awayLineup];participants.forEach(p=>{p.stats=p.stats||{apps:0,goals:0,assists:0};p.stats.apps++});const events=[];for(const [club,count,lineup] of [[homeName,hg,homeLineup],[awayName,ag,awayLineup]])for(let i=0;i<count;i++){const eligible=lineup.map(p=>p.id);const scorer=pickPlayer(club,[],eligible);if(!scorer)continue;const assist=Math.random()<.72?pickPlayer(club,[scorer.id],eligible):null;scorer.stats.goals++;if(assist)assist.stats.assists++;events.push({minute:Math.floor(Math.random()*90)+1,team:club,scorerId:scorer.id,assistId:assist?.id||null})}events.sort((a,b)=>a.minute-b.minute);const m={id:uid(),home:homeName,away:awayName,a:hg,b:ag,competition,date:new Date().toLocaleString('es'),events,participants:participants.map(p=>p.id)};matches.push(m);if(fixture){fixture.status='Jugado';fixture.scoreHome=hg;fixture.scoreAway=ag;fixture.matchId=m.id}save();toast(`Resultado: ${homeName} ${hg} - ${ag} ${awayName}`)}
function matchesPage(){shell('Centro de partidos',`<div class="eyebrow">JUGAR Y SIMULAR</div><h1>Partidos</h1><div class="card"><h2>Partido amistoso</h2>${teams.length>=2?`<form id="friendlyForm"><div class="row"><div class="field"><label>Local</label><select name="home">${teams.map(t=>`<option>${esc(t.name)}</option>`).join('')}</select></div><div class="field"><label>Visitante</label><select name="away">${teams.map((t,i)=>`<option ${i===1?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div></div><div class="actions"><button>Simular amistoso</button></div></form>`:'<p class="empty">Crea al menos dos equipos para jugar un amistoso.</p>'}</div><div class="card"><h2>Partidos pendientes de tus ligas</h2>${comps.some(c=>c.fixtures?.some(f=>f.status!=='Jugado'))?comps.map((c,ci)=>{const fs=(c.fixtures||[]).filter(f=>f.status!=='Jugado');return fs.length?`<h3>${esc(c.name)}</h3>${fs.map(f=>`<div class="fixture"><span class="home">J${f.round} · ${esc(f.home)}</span><b class="score">VS</b><span class="away">${esc(f.away)}</span><button class="smallbtn" data-play-fixture="${ci}|${f.id}">Simular</button></div>`).join('')}`:''}).join(''):'<p class="empty">No hay partidos pendientes. Crea una liga y genera su calendario.</p>'}</div>`)}
function historyPage(){shell('Historial y estadísticas',`<div class="eyebrow">ARCHIVO DE TEMPORADA</div><h1>Historial</h1><div class="card"><h2>Partidos jugados</h2>${matches.length?matches.slice().reverse().map(m=>`<div class="card" style="margin:10px 0"><div class="fixture"><span class="home">${esc(m.home)}</span><b class="score">${m.a} - ${m.b}</b><span class="away">${esc(m.away)}</span><span class="tag">${esc(m.competition||'Amistoso')} · ${esc(m.date)}</span></div>${m.events?.length?m.events.map(ev=>{const s=players.find(p=>p.id===ev.scorerId),a=players.find(p=>p.id===ev.assistId);return `<div class="eventline">⚽ ${ev.minute}' · ${esc(s?.name||'Jugador eliminado')} (${esc(ev.team)})${a?` <span class="muted">— asistencia: ${esc(a.name)}</span>`:''}</div>`}).join(''):'<p class="notice">Sin goleadores registrados (partido de una versión anterior).</p>'}</div>`).join(''):'<p class="empty">Aún no hay partidos disputados.</p>'}</div><div class="two"><div class="card"><h2>Máximos goleadores</h2>${playerRanking('goals')}</div><div class="card"><h2>Máximos asistentes</h2>${playerRanking('assists')}</div></div>`)}
function playerRanking(key){const list=players.filter(p=>(p.stats?.[key]||0)>0).sort((a,b)=>(b.stats[key]||0)-(a.stats[key]||0)).slice(0,10);return list.length?list.map((p,i)=>`<div class="team"><span>${i+1}. <b>${esc(p.name)}</b><div class="notice">${esc(p.team)}</div></span><span class="pill">${p.stats[key]}</span></div>`).join(''):'<p class="empty">Las estadísticas aparecerán después de jugar.</p>'}
function settingsPage(){shell('Configuración y respaldos',`<div class="eyebrow">TUS DATOS</div><h1>Configuración</h1><div class="card"><h2>Guardar o transferir tu universo</h2><p class="notice">Exporta todos tus equipos, jugadores, ligas, calendarios, resultados y estadísticas en un archivo de respaldo. Para pasar tus datos de PC a Android, exporta aquí e importa el archivo en el otro dispositivo.</p><div class="actions"><button id="exportBtn">Exportar respaldo</button><label class="secondary" style="padding:10px 14px;border-radius:10px;cursor:pointer">Importar respaldo<input id="importFile" type="file" accept="application/json" hidden></label></div></div><div class="card"><h2>Instalación</h2><p class="notice">En PC puedes abrir index.html para probar. Para instalar como aplicación en PC o Android, publica los archivos en una dirección HTTPS y usa el menú del navegador: Instalar aplicación o Añadir a pantalla de inicio.</p></div><div class="card"><h2>Restablecer datos</h2><p class="notice">Esta acción borra los datos guardados en este navegador.</p><button class="danger" id="resetBtn">Borrar todo</button></div><div class="card"><h2>Acerca del proyecto</h2><p>Soccer Simulator 2026 · Versión 1.2</p><p class="notice">Esta versión guarda datos localmente. No tiene cuentas ni sincronización automática en la nube.</p></div>`)}
function render(){nav();({home,teams:teamsPage,players:playersPage,competitions:compsPage,matches:matchesPage,history:historyPage,settings:settingsPage}[page])()}
document.addEventListener('click',e=>{const p=e.target.closest('[data-page]');if(p){page=p.dataset.page;render()}const g=e.target.closest('[data-go]');if(g){page=g.dataset.go;render()}const dt=e.target.closest('[data-delete-team]');if(dt){const t=teams[+dt.dataset.deleteTeam];if(comps.some(c=>c.teams.includes(t.name)))return toast('Este club está inscrito en una liga. Elimina primero esa liga para evitar alterar su calendario.');if(!confirm(`¿Eliminar ${t.name} y sus jugadores?`))return;players=players.filter(p=>p.team!==t.name);teams.splice(+dt.dataset.deleteTeam,1);save()}const dp=e.target.closest('[data-delete-player]');if(dp){players=players.filter(p=>p.id!==dp.dataset.deletePlayer);save()}const dc=e.target.closest('[data-delete-comp]');if(dc){if(confirm('¿Eliminar esta liga y su calendario? Los resultados ya jugados se conservarán en el historial.')){comps.splice(+dc.dataset.deleteComp,1);save()}}const cal=e.target.closest('[data-calendar]');if(cal){const c=comps[+cal.dataset.calendar];c.fixtures=makeSchedule(c,c.legs===2);save();toast('Calendario generado.')}const pf=e.target.closest('[data-play-fixture]');if(pf){const [ci,id]=pf.dataset.playFixture.split('|'),c=comps[+ci],f=c.fixtures.find(x=>x.id===id);if(f&&f.status!=='Jugado')playMatch(f.home,f.away,c.name,f)}});
document.addEventListener('submit',e=>{if(e.target.id==='teamForm'){e.preventDefault();const f=new FormData(e.target),name=f.get('name').trim();if(teams.some(t=>t.name.toLowerCase()===name.toLowerCase()))return toast('Ya existe un equipo con ese nombre.');teams.push({id:uid(),name,rating:+f.get('rating')});save();toast('Equipo creado.')}if(e.target.id==='playerForm'){e.preventDefault();const f=new FormData(e.target),name=f.get('name').trim(),team=f.get('team'),number=+f.get('number');if(players.some(p=>p.team===team&&p.number===number))return toast('Ese dorsal ya está ocupado en ese club.');players.push({id:uid(),name,country:f.get('country').trim(),team,age:+f.get('age'),position:f.get('position'),number,rating:+f.get('rating'),stats:{apps:0,goals:0,assists:0}});save();toast('Jugador añadido a la plantilla.')}if(e.target.id==='compForm'){e.preventDefault();const f=new FormData(e.target),name=f.get('name').trim();if(comps.some(c=>c.name.toLowerCase()===name.toLowerCase()))return toast('Ya existe una liga con ese nombre.');comps.push({id:uid(),name,format:'Liga todos contra todos',teams:[],fixtures:[],legs:+f.get('legs')});save();toast('Liga creada.')}if(e.target.classList.contains('enrollForm')){e.preventDefault();const c=comps[+e.target.dataset.comp],team=new FormData(e.target).get('team');if(team&&!c.teams.includes(team)){c.teams.push(team);save();toast('Equipo inscrito.')}}if(e.target.id==='friendlyForm'){e.preventDefault();const f=new FormData(e.target),h=f.get('home'),a=f.get('away');if(h===a)return toast('Elige dos equipos diferentes.');playMatch(h,a,'');}});
document.addEventListener('click',e=>{if(e.target.id==='exportBtn'){const data={version:1.2,teams,players,comps,matches},blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='soccer-simulator-2026-respaldo.json';a.click();URL.revokeObjectURL(a.href)}if(e.target.id==='resetBtn'&&confirm('¿Seguro que deseas borrar todos los datos de este dispositivo?')){teams=[];players=[];comps=[];matches=[];save()}});
document.addEventListener('change',e=>{if(e.target.id==='importFile'){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.teams)||!Array.isArray(d.players)||!Array.isArray(d.comps)||!Array.isArray(d.matches))throw Error('Formato incorrecto');teams=d.teams;players=d.players;comps=d.comps;matches=d.matches;teams.forEach(t=>t.id=t.id||uid());players.forEach(p=>{p.id=p.id||uid();p.stats=p.stats||{apps:0,goals:0,assists:0}});comps.forEach(c=>{c.id=c.id||uid();c.teams=c.teams||[];c.fixtures=c.fixtures||[]});save();toast('Respaldo importado correctamente.')}catch(err){alert('No se pudo importar: el archivo no parece ser un respaldo válido de Soccer Simulator 2026.')}};r.readAsText(file)}});
let installPrompt;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;const b=document.getElementById('installBtn');b.hidden=false;b.onclick=async()=>{installPrompt.prompt();installPrompt=null;b.hidden=true}});if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
