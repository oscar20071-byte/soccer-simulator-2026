<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07131f"><title>Soccer Simulator 2026 · v2.0</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#07131f;--panel:#0d1d2c;--panel2:#12283a;--line:#20394d;--txt:#edf6fb;--muted:#91a9ba;--green:#20d6a2;--gold:#f4c96b;--red:#ff7185}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px Inter,system-ui,Segoe UI,Arial,sans-serif}button,input,select{font:inherit}button{border:0;border-radius:10px;padding:10px 14px;background:var(--green);color:#042018;font-weight:800;cursor:pointer}button.secondary{background:#172d40;color:var(--txt);border:1px solid var(--line)}button.danger{background:#492331;color:#ffdce3}.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{background:#091724;border-right:1px solid var(--line);padding:20px 14px}.brand{font-weight:950;letter-spacing:.08em;font-size:19px;margin:5px 8px 25px}.brand b{color:var(--green)}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.2em;margin-top:5px}.nav{display:grid;gap:6px}.nav button{background:transparent;color:var(--muted);text-align:left;font-weight:700}.nav button.active,.nav button:hover{background:#10372f;color:var(--green)}.main{min-width:0}.top{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px}.top small{color:var(--muted);font-weight:800;letter-spacing:.12em}.content{padding:26px;max-width:1500px;margin:auto}.hero{border:1px solid var(--line);border-radius:22px;padding:30px;background:radial-gradient(ellipse at 85% 10%,#0d5b4b 0,transparent 42%),linear-gradient(120deg,#102235,#091925);min-height:205px}.eyebrow{color:var(--green);font-size:11px;font-weight:900;letter-spacing:.18em}.hero h1{font-size:clamp(30px,5vw,52px);line-height:1.03;margin:13px 0}.hero p,.notice{color:var(--muted);line-height:1.5}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin:17px 0}.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:17px}.stat small{color:var(--muted);font-size:10px;font-weight:900;letter-spacing:.1em}.stat strong{display:block;font-size:29px;margin-top:6px}.card{margin-top:15px;overflow:hidden}.card h2{font-size:18px;margin:0 0 14px}.actions,.row{display:flex;gap:9px;flex-wrap:wrap;align-items:end;margin-top:12px}.field{display:grid;gap:6px;min-width:130px;flex:1}.field label{font-size:12px;color:var(--muted);font-weight:750}.field input,.field select{width:100%;min-width:0;background:#081724;color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:11px}.field input[type=file]{padding:8px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:550px}th,td{text-align:left;padding:10px 9px;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:10px;color:var(--muted);letter-spacing:.1em}.empty{color:var(--muted);padding:15px 0}.teamrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.teamrow:last-child{border:0}.crest,.avatar{width:42px;height:42px;border-radius:12px;object-fit:cover;background:#193247;display:grid;place-items:center;font-weight:900;color:var(--green);flex:none}.avatar{border-radius:50%}.pill{font-size:11px;color:var(--green);background:#10372f;padding:5px 9px;border-radius:99px;white-space:nowrap}.fixture{display:grid;grid-template-columns:1fr auto 1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.away{text-align:right}.score{font-size:20px;font-weight:950;color:var(--green);white-space:nowrap}.mobilebar{display:none}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#173d35;border:1px solid #247d67;color:#eafff7;padding:12px 18px;border-radius:12px;z-index:10;box-shadow:0 10px 30px #0008;max-width:90vw}.subhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.mini{padding:7px 10px;font-size:12px}.tag{font-size:11px;color:var(--gold)}.playercell{display:flex;align-items:center;gap:9px}.playercell img{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#193247}
@media(max-width:850px){.app{grid-template-columns:1fr}.side{display:none}.mobilebar{display:flex;overflow:auto;gap:5px;padding:8px;background:#091724;border-bottom:1px solid var(--line)}.mobilebar button{white-space:nowrap;padding:9px 11px}.top{padding:0 16px}.content{padding:15px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding:22px}.two{grid-template-columns:1fr}}
@media(max-width:480px){.top{height:60px}.stat{padding:12px}.stat strong{font-size:23px}.fixture{grid-template-columns:1fr auto 1fr}.fixture button{grid-column:1/-1}.fixture .home,.fixture .away{font-size:13px}}
</style></head>
<body>
<div class="app"><aside class="side"><div class="brand">SOCCER<b>SIM</b><small>SIMULATOR 2026 · V2.0</small></div><nav class="nav" id="sideNav"></nav><p class="notice" style="margin:25px 8px;font-size:12px">Tu universo de fútbol. Datos guardados en este dispositivo.</p></aside>
<div class="main"><header class="top"><small id="sectionLabel">CENTRO DE OPERACIONES</small><span class="pill">VERSIÓN 2.0</span></header><nav class="mobilebar" id="mobileNav"></nav><main class="content" id="view"></main></div></div>
<script>
const pages=[['home','⌂','Inicio'],['teams','◈','Clubes'],['players','♟','Jugadores'],['comps','🏆','Competiciones'],['calendar','▦','Calendario'],['matches','⚽','Centro de partido'],['stats','▤','Estadísticas'],['history','◷','Historial'],['settings','⚙','Configuración']];
const read=(k,d)=>{try{return JSON.parse(localStorage.getItem('ss26v2_'+k))??d}catch{return d}};
let teams=read('teams',[]),players=read('players',[]),comps=read('comps',[]),matches=read('matches',[]),page='home';
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>{for(const [k,v] of Object.entries({teams,players,comps,matches}))localStorage.setItem('ss26v2_'+k,JSON.stringify(v));render()};
function toast(s){let e=document.querySelector('.toast');if(e)e.remove();e=document.createElement('div');e.className='toast';e.textContent=s;document.body.append(e);setTimeout(()=>e.remove(),2600)}
function nav(){for(const id of ['sideNav','mobileNav'])document.getElementById(id).innerHTML=pages.map(([k,ic,n])=>`<button class="${page===k?'active':''}" data-page="${k}">${ic} &nbsp;${n}</button>`).join('')}
function shell(title,body){document.getElementById('sectionLabel').textContent=title.toUpperCase();document.getElementById('view').innerHTML=body;nav()}
function crest(t){return t.crest?`<img class="crest" src="${t.crest}">`:`<span class="crest">⚽</span>`}
function avatar(p){return p.photo?`<img class="avatar" src="${p.photo}">`:`<span class="avatar">♟</span>`}
function strength(n){let a=players.filter(p=>p.team===n).sort((x,y)=>y.rating-x.rating).slice(0,11);return a.length?a.reduce((s,p)=>s+(+p.rating||60),0)/a.length:(teams.find(t=>t.name===n)?.rating||65)}
function standings(c){let r=c.teams.map(name=>({name,pj:0,g:0,e:0,p:0,gf:0,gc:0,pts:0})),m=Object.fromEntries(r.map(x=>[x.name,x]));matches.filter(x=>x.competition===c.name).forEach(x=>{let h=m[x.home],a=m[x.away];if(!h||!a)return;h.pj++;a.pj++;h.gf+=x.a;h.gc+=x.b;a.gf+=x.b;a.gc+=x.a;if(x.a>x.b){h.g++;h.pts+=3;a.p++}else if(x.a<x.b){a.g++;a.pts+=3;h.p++}else{h.e++;a.e++;h.pts++;a.pts++}});return r.sort((a,b)=>b.pts-a.pts||(b.gf-b.gc)-(a.gf-a.gc)||b.gf-a.gf)}
function schedule(c){let a=[...c.teams];if(a.length<2)return[];if(a.length%2)a.push(null);let n=a.length,rounds=n-1,half=n/2,fs=[],rot=[...a];for(let r=0;r<rounds;r++){for(let i=0;i<half;i++){let x=rot[i],y=rot[n-1-i];if(x&&y){let h=(r+i)%2===0?x:y;fs.push({id:uid(),round:r+1,home:h,away:h===x?y:x,status:'Pendiente'})}}rot=[rot[0],rot[n-1],...rot.slice(1,n-1)]}if(c.legs===2)fs.push(...fs.map(f=>({id:uid(),round:f.round+rounds,home:f.away,away:f.home,status:'Pendiente'})));return fs}
function poisson(l){let z=Math.exp(-l),k=0,p=1;do{k++;p*=Math.random()}while(p>z&&k<8);return Math.min(7,k-1)}
function pick(team,exclude=[]){let a=players.filter(p=>p.team===team&&!exclude.includes(p.id));if(!a.length)return null;let w=a.map(p=>({p,w:Math.max(1,p.rating*(p.position==='DC'?1.5:['EI','ED','MCO'].includes(p.position)?1.25:.8))})),sum=w.reduce((s,x)=>s+x.w,0),r=Math.random()*sum;for(let x of w){r-=x.w;if(r<=0)return x.p}return w[0].p}
function play(h,a,competition='',fixture=null){let hg=poisson(Math.max(.25,Math.min(3.2,1.25+(strength(h)-strength(a))/48+.18))),ag=poisson(Math.max(.25,Math.min(3.2,1.15+(strength(a)-strength(h))/48))),line=[...players.filter(p=>p.team===h).sort((x,y)=>y.rating-x.rating).slice(0,11),...players.filter(p=>p.team===a).sort((x,y)=>y.rating-x.rating).slice(0,11)],events=[];line.forEach(p=>p.stats.apps++);for(let [club,num] of [[h,hg],[a,ag]])for(let i=0;i<num;i++){let s=pick(club);if(!s)continue;let as=Math.random()<.72?pick(club,[s.id]):null;s.stats.goals++;if(as)as.stats.assists++;events.push({minute:1+Math.floor(Math.random()*90),team:club,scorerId:s.id,assistId:as?.id||null})}events.sort((x,y)=>x.minute-y.minute);matches.push({id:uid(),home:h,away:a,a:hg,b:ag,competition,date:new Date().toLocaleString('es'),events});if(fixture){fixture.status='Jugado';fixture.scoreHome=hg;fixture.scoreAway=ag}save();toast(`Final: ${h} ${hg} - ${ag} ${a}`)}
function home(){shell('Centro de operaciones',`<section class="hero"><div class="eyebrow">TU UNIVERSO FUTBOLÍSTICO</div><h1>Tu fútbol.<br>Tus reglas.</h1><p>Crea tus clubes, diseña plantillas con fotografías, organiza competiciones y simula temporadas completas.</p><div class="actions"><button data-go="teams">＋ Crear club</button><button class="secondary" data-go="players">Crear jugador</button><button class="secondary" data-go="comps">Crear competición</button></div></section><div class="grid"><div class="stat"><small>CLUBES</small><strong>${teams.length}</strong></div><div class="stat"><small>JUGADORES</small><strong>${players.length}</strong></div><div class="stat"><small>COMPETICIONES</small><strong>${comps.length}</strong></div><div class="stat"><small>PARTIDOS</small><strong>${matches.length}</strong></div></div><div class="card"><h2>Últimos resultados</h2>${matches.length?matches.slice(-5).reverse().map(m=>`<div class="fixture"><span>${esc(m.home)}</span><b class="score">${m.a} - ${m.b}</b><span class="away">${esc(m.away)}</span><span class="tag">${esc(m.competition||'Amistoso')}</span></div>`).join(''):'<p class="empty">Cuando simules partidos, los resultados aparecerán aquí.</p>'}</div>`)}
function teamsPage(){shell('Clubes',`<div class="eyebrow">GESTIÓN DE CLUBES</div><h1>Mis clubes</h1><div class="card"><h2>Crear club</h2><form id="teamForm"><div class="row"><div class="field"><label>Nombre</label><input name="name" maxlength="40" required placeholder="Atlético Central"></div><div class="field"><label>Valoración base</label><input name="rating" type="number" min="1" max="100" value="70" required></div><div class="field"><label>Escudo (imagen)</label><input name="crest" type="file" accept="image/*"></div><button>Guardar club</button></div></form></div><div class="card"><h2>Clubes creados (${teams.length})</h2>${teams.length?teams.map((t,i)=>`<div class="teamrow">${crest(t)}<div style="flex:1"><b>${esc(t.name)}</b><div class="notice">Media base ${t.rating} · ${players.filter(p=>p.team===t.name).length} jugadores</div></div><button class="danger mini" data-del-team="${i}">Eliminar</button></div>`).join(''):'<p class="empty">Aún no hay clubes. Crea el primero arriba.</p>'}</div>`)}
function playersPage(){
 let squads=teams.map(t=>{
   let squad=players.filter(p=>p.team===t.name).sort((a,b)=>a.number-b.number);
   let rows=squad.map(p=>`<tr><td><span class="playercell">${avatar(p)}<b>${esc(p.name)}</b></span></td><td>${p.position}</td><td>${p.age}</td><td>${p.number}</td><td>${p.rating}</td><td>${p.stats.apps}</td><td>${p.stats.goals}</td><td>${p.stats.assists}</td><td><button class="danger mini" data-del-player="${p.id}">Quitar</button></td></tr>`).join('');
   return `<h3>${crest(t)} ${esc(t.name)} <span class="notice">(${squad.length})</span></h3>${squad.length?`<div class="tablewrap"><table><thead><tr><th>Jugador</th><th>Pos.</th><th>Edad</th><th>Dorsal</th><th>Media</th><th>PJ</th><th>G</th><th>A</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`:'<p class="empty">Plantilla vacía.</p>'}`;
 }).join('');
 shell('Jugadores',`<div class="eyebrow">PLANTILLAS PERSONALIZADAS</div><h1>Jugadores</h1><div class="card"><h2>Registrar futbolista</h2>${teams.length?`<form id="playerForm"><div class="row"><div class="field"><label>Nombre completo</label><input name="name" required maxlength="48"></div><div class="field"><label>Nacionalidad</label><input name="country" maxlength="32" placeholder="Dominicana"></div><div class="field"><label>Club</label><select name="team">${teams.map(t=>`<option>${esc(t.name)}</option>`).join('')}</select></div><div class="field"><label>Fotografía</label><input name="photo" type="file" accept="image/*"></div></div><div class="row"><div class="field"><label>Edad</label><input name="age" type="number" min="15" max="50" value="20"></div><div class="field"><label>Posición</label><select name="position">${['POR','DFC','LI','LD','MCD','MC','MCO','EI','ED','DC'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Dorsal</label><input name="number" type="number" min="1" max="99" value="10"></div><div class="field"><label>Media (1–100)</label><input name="rating" type="number" min="1" max="100" value="75"></div></div><div class="actions"><button>Guardar jugador</button></div></form>`:'<p class="empty">Primero crea un club para registrar jugadores.</p>'}</div><div class="card"><h2>Plantillas</h2>${teams.length?squads:'<p class="empty">Crea un club para comenzar.</p>'}</div>`);
}
function compsPage(){shell('Competiciones',`<div class="eyebrow">TORNEOS Y LIGAS</div><h1>Competiciones</h1><div class="card"><h2>Nueva competición</h2><form id="compForm"><div class="row"><div class="field"><label>Nombre</label><input name="name" required maxlength="45" placeholder="Liga Nacional"></div><div class="field"><label>Formato</label><select name="format"><option>Liga</option><option>Torneo</option></select></div><div class="field"><label>Calendario</label><select name="legs"><option value="1">Una vuelta</option><option value="2">Ida y vuelta</option></select></div><button>Crear</button></div></form></div>${comps.length?comps.map((c,i)=>`<div class="card"><div class="subhead"><h2>${esc(c.name)}</h2><button class="danger mini" data-del-comp="${i}">Eliminar</button></div><p class="notice">${c.format} · ${c.teams.length} clubes · ${c.fixtures.length} partidos</p><form class="enroll" data-ci="${i}"><div class="row"><div class="field"><label>Inscribir club</label><select name="team">${teams.filter(t=>!c.teams.includes(t.name)).map(t=>`<option>${esc(t.name)}</option>`).join('')}</select></div><button ${!teams.some(t=>!c.teams.includes(t.name))||c.fixtures.length?'disabled':''}>Inscribir</button></div></form><div class="actions"><button class="secondary" data-gen="${i}" ${c.teams.length<2||c.fixtures.length?'disabled':''}>Generar calendario</button></div><h3>Clasificación</h3>${tableStand(c)}<p class="notice">Inscritos: ${c.teams.map(esc).join(' · ')||'ninguno'}</p></div>`).join(''):'<div class="card"><p class="empty">Todavía no has creado competiciones.</p></div>'}`)}
function tableStand(c){let r=standings(c);return r.length?`<div class="tablewrap"><table><thead><tr><th>#</th><th>Club</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>GF</th><th>GC</th><th>DG</th><th>PTS</th></tr></thead><tbody>${r.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.name)}</td><td>${x.pj}</td><td>${x.g}</td><td>${x.e}</td><td>${x.p}</td><td>${x.gf}</td><td>${x.gc}</td><td>${x.gf-x.gc}</td><td><b>${x.pts}</b></td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">Inscribe al menos dos clubes.</p>'}
function calendarPage(){shell('Calendario',`<div class="eyebrow">TEMPORADAS</div><h1>Calendario de partidos</h1>${comps.length?comps.map((c,i)=>`<div class="card"><h2>${esc(c.name)}</h2>${c.fixtures.length?c.fixtures.map(f=>`<div class="fixture"><span>J${f.round} · ${esc(f.home)}</span><b class="score">${f.status==='Jugado'?`${f.scoreHome} - ${f.scoreAway}`:'VS'}</b><span class="away">${esc(f.away)}</span>${f.status==='Jugado'?'<span class="pill">Jugado</span>':`<button class="mini" data-play="${i}|${f.id}">Simular</button>`}</div>`).join(''):'<p class="empty">Esta competición aún no tiene calendario. Genéralo en Competiciones.</p>'}</div>`).join(''):'<div class="card"><p class="empty">Crea una competición para generar jornadas.</p></div>'}`)}
function matchesPage(){shell('Centro de partido',`<div class="eyebrow">SIMULACIÓN</div><h1>Centro de partido</h1><div class="card"><h2>Partido amistoso</h2>${teams.length>=2?`<form id="friendly"><div class="row"><div class="field"><label>Local</label><select name="home">${teams.map(t=>`<option>${esc(t.name)}</option>`).join('')}</select></div><div class="field"><label>Visitante</label><select name="away">${teams.map((t,i)=>`<option ${i===1?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div><button>Simular partido</button></div></form>`:'<p class="empty">Crea al menos dos clubes para jugar.</p>'}</div><div class="card"><h2>Últimos encuentros</h2>${matches.length?matches.slice(-8).reverse().map(m=>`<div class="fixture"><span>${esc(m.home)}</span><b class="score">${m.a} - ${m.b}</b><span class="away">${esc(m.away)}</span><span class="tag">${esc(m.competition||'Amistoso')}</span></div>`).join(''):'<p class="empty">Todavía no hay partidos.</p>'}</div>`)}
function statsPage(){let rank=k=>{let a=players.filter(p=>p.stats[k]>0).sort((x,y)=>y.stats[k]-x.stats[k]).slice(0,10);return a.length?a.map((p,i)=>`<div class="teamrow"><span style="flex:1">${i+1}. <b>${esc(p.name)}</b><div class="notice">${esc(p.team)}</div></span><span class="pill">${p.stats[k]}</span></div>`).join(''):'<p class="empty">Sin datos todavía.</p>'};shell('Estadísticas',`<div class="eyebrow">RENDIMIENTO INDIVIDUAL</div><h1>Estadísticas</h1><div class="two"><div class="card"><h2>Máximos goleadores</h2>${rank('goals')}</div><div class="card"><h2>Máximos asistentes</h2>${rank('assists')}</div></div><div class="card"><h2>Partidos disputados</h2>${rank('apps')}</div>`)}
function historyPage(){shell('Historial',`<div class="eyebrow">ARCHIVO</div><h1>Historial de partidos</h1><div class="card">${matches.length?matches.slice().reverse().map(m=>`<div class="card"><div class="fixture"><span>${esc(m.home)}</span><b class="score">${m.a} - ${m.b}</b><span class="away">${esc(m.away)}</span></div><p class="notice">${esc(m.competition||'Amistoso')} · ${esc(m.date)}</p>${(m.events||[]).map(e=>{let p=players.find(x=>x.id===e.scorerId),a=players.find(x=>x.id===e.assistId);return `<p class="notice">⚽ ${e.minute}' ${esc(p?.name||'Jugador')} ${a?'· Asistencia: '+esc(a.name):''}</p>`}).join('')}</div>`).join(''):'<p class="empty">Tu historial aparecerá después del primer partido.</p>'}</div>`)}
function settingsPage(){shell('Configuración',`<div class="eyebrow">DATOS Y APLICACIÓN</div><h1>Configuración</h1><div class="card"><h2>Respaldos</h2><p class="notice">Exporta tus clubes, fotografías, jugadores, competiciones, calendarios y resultados para moverlos entre dispositivos.</p><div class="actions"><button id="export">Exportar respaldo</button><label class="secondary" style="padding:10px 14px;border-radius:10px;cursor:pointer">Importar respaldo<input id="import" type="file" accept="application/json" hidden></label></div></div><div class="card"><h2>Almacenamiento</h2><p class="notice">Los datos se guardan en este navegador. Para pasar de PC a Android, exporta e importa un respaldo.</p><button class="danger" id="reset">Restablecer todos los datos</button></div><div class="card"><h2>Acerca de</h2><p>Soccer Simulator 2026 · Versión 2.0</p><p class="notice">No incluye mercado de fichajes. Las imágenes se guardan localmente en el dispositivo.</p></div>`)}
function render(){nav();({home,teams:teamsPage,players:playersPage,comps:compsPage,calendar:calendarPage,matches:matchesPage,stats:statsPage,history:historyPage,settings:settingsPage}[page])()}
function fileData(file){return new Promise((res,rej)=>{if(!file)return res('');let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
document.addEventListener('click',e=>{let p=e.target.closest('[data-page]');if(p){page=p.dataset.page;render()}let g=e.target.closest('[data-go]');if(g){page=g.dataset.go;render()}let dt=e.target.closest('[data-del-team]');if(dt){let t=teams[+dt.dataset.delTeam];if(comps.some(c=>c.teams.includes(t.name)))return toast('Elimina primero la competición donde está inscrito.');if(confirm('¿Eliminar club y sus jugadores?')){players=players.filter(x=>x.team!==t.name);teams.splice(+dt.dataset.delTeam,1);save()}}let dp=e.target.closest('[data-del-player]');if(dp){players=players.filter(x=>x.id!==dp.dataset.delPlayer);save()}let dc=e.target.closest('[data-del-comp]');if(dc&&confirm('¿Eliminar competición y calendario?')){comps.splice(+dc.dataset.delComp,1);save()}let gn=e.target.closest('[data-gen]');if(gn){let c=comps[+gn.dataset.gen];c.fixtures=schedule(c);save();toast('Calendario generado.')}let pl=e.target.closest('[data-play]');if(pl){let [ci,id]=pl.dataset.play.split('|'),f=comps[+ci].fixtures.find(x=>x.id===id);if(f&&f.status!=='Jugado')play(f.home,f.away,comps[+ci].name,f)}if(e.target.id==='export'){let blob=new Blob([JSON.stringify({teams,players,comps,matches},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='soccer-simulator-2026-respaldo.json';a.click();URL.revokeObjectURL(a.href)}if(e.target.id==='reset'&&confirm('Esto borra los datos de Soccer Simulator 2026 en este navegador. ¿Continuar?')){teams=[];players=[];comps=[];matches=[];save()}});
document.addEventListener('submit',async e=>{let f=e.target;if(f.id==='teamForm'){e.preventDefault();let d=new FormData(f),name=d.get('name').trim();if(teams.some(t=>t.name.toLowerCase()===name.toLowerCase()))return toast('Ese club ya existe.');let crest=await fileData(d.get('crest'));teams.push({id:uid(),name,rating:+d.get('rating'),crest});save();toast('Club creado.')}if(f.id==='playerForm'){e.preventDefault();let d=new FormData(f),name=d.get('name').trim(),team=d.get('team'),number=+d.get('number');if(players.some(p=>p.team===team&&p.number===number))return toast('Ese dorsal ya está ocupado en el club.');let photo=await fileData(d.get('photo'));players.push({id:uid(),name,country:d.get('country'),team,age:+d.get('age'),position:d.get('position'),number,rating:+d.get('rating'),photo,stats:{apps:0,goals:0,assists:0}});save();toast('Jugador registrado.')}if(f.id==='compForm'){e.preventDefault();let d=new FormData(f),name=d.get('name').trim();if(comps.some(c=>c.name.toLowerCase()===name.toLowerCase()))return toast('Esa competición ya existe.');comps.push({id:uid(),name,format:d.get('format'),legs:+d.get('legs'),teams:[],fixtures:[]});save();toast('Competición creada.')}if(f.classList.contains('enroll')){e.preventDefault();let c=comps[+f.dataset.ci],team=new FormData(f).get('team');if(team&&!c.teams.includes(team)){c.teams.push(team);save();toast('Club inscrito.')}}if(f.id==='friendly'){e.preventDefault();let d=new FormData(f);if(d.get('home')===d.get('away'))return toast('Selecciona dos clubes diferentes.');play(d.get('home'),d.get('away'))}});
document.addEventListener('change',async e=>{if(e.target.id==='import'&&e.target.files[0]){try{let d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d.teams)||!Array.isArray(d.players)||!Array.isArray(d.comps)||!Array.isArray(d.matches))throw Error();teams=d.teams;players=d.players;comps=d.comps;matches=d.matches;players.forEach(p=>p.stats=p.stats||{apps:0,goals:0,assists:0});save();toast('Respaldo importado.')}catch{toast('El archivo no es un respaldo válido.')}}});
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
render();
</script></body></html>
