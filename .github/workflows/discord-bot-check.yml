name: Verificar bot de Discord

on:
  pull_request:
    paths:
      - "discord-bot/**"
      - "backend/supabase/discord_activity.sql"
      - ".github/workflows/discord-bot-check.yml"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        working-directory: discord-bot
        run: npm install --ignore-scripts

      - name: Comprobar sintaxis
        working-directory: discord-bot
        run: node --check index.js
