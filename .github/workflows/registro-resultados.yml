name: Registro de resultados

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  registro:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verificar sistema
        run: |
          echo "Sistema de registro preparado."
          echo "Repositorio: $GITHUB_REPOSITORY"
          echo "Ejecutado por: $GITHUB_ACTOR"
