name: Registro de resultados

on:
  workflow_dispatch:
    inputs:
      partido_id:
        description: "Identificador único del partido"
        required: true
        type: string
      equipo_local:
        description: "Equipo local"
        required: true
        type: string
      equipo_visitante:
        description: "Equipo visitante"
        required: true
        type: string
      goles_local:
        description: "Goles del equipo local"
        required: true
        type: string
      goles_visitante:
        description: "Goles del equipo visitante"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: registro-partidos
  cancel-in-progress: false

jobs:
  registro:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Registrar partido
        env:
          PARTIDO_ID: ${{ inputs.partido_id }}
          EQUIPO_LOCAL: ${{ inputs.equipo_local }}
          EQUIPO_VISITANTE: ${{ inputs.equipo_visitante }}
          GOLES_LOCAL: ${{ inputs.goles_local }}
          GOLES_VISITANTE: ${{ inputs.goles_visitante }}
        run: node scripts/registrar-partido.js

      - name: Verificar resultados
        run: node scripts/verificar-partidos.js

      - name: Crear solicitud de revisión
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: resultados/${{ inputs.partido_id }}
          delete-branch: false
          commit-message: "Registrar nuevo resultado oficial"
          title: "Nuevo resultado oficial: ${{ inputs.partido_id }}"
          body: "Solicitud automática para revisar y publicar un resultado oficial."
          add-paths: data/partidos.json
